<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
{% include seo-head.html %}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="site.css"></head>
<body data-page="insights" data-nav="Аналитика">
{% include gtm-body.html %}
<div id="site-header"></div>

<section class="phero"><div class="phero__bg" style="background-image:url('assets/spiral.jpg')"></div>
 <div class="wrap phero__in"><div class="crumbs"><a href="/">Главная</a><span>/</span><span>Аналитика</span></div>
 <h1 class="h-xl" style="max-width:15ch">Идеи, которые меняют цифровое государство.</h1>
 <p class="lead">Взгляд на цифровую стратегию, данные и ИИ — из Кыргызстана и не только.</p></div></section>
<section class="sec"><div class="wrap"><div class="filters rv" id="pf" style="margin-bottom:40px"></div><div class="posts" id="plist"></div></div></section>
<div id="site-cta"></div>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
const P=PUB;plist.innerHTML=P.articles.map(postCard).join('');const cats=[...new Set(P.articles.map(a=>a.cat))];
pf.innerHTML='<button class="on" data-c="all">Все</button>'+cats.map(c=>`<button data-c="${c}">${c}</button>`).join('');
pf.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;pf.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));plist.querySelectorAll('.post').forEach(p=>{p.hidden=!(b.dataset.c==='all'||p.dataset.cat===b.dataset.c);p.classList.remove('pre')});});
PUBinit();
</script>
</body></html>
